# Claude for chat; Anthropic has no embedding API, so embeddings stay on OpenAI.
spring:
  ai:
    model:
      chat: anthropic
      embedding: openai
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${ANTHROPIC_CHAT_MODEL:claude-sonnet-5-5}
          max-tokens: 2048
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${app.embedding.dimensions}
